<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Burn by Dawn</title>
  <style>
    /* The game is a double-page spread from an 80s comic annual (SPEC.md §11):
       the board on the left page, the clock, briefing, dial and roster rail
       on the right. Colours, paper and type come from src/render/theme.js,
       which sets the custom properties below at startup; the values here are
       only what shows before it runs. The sizes in --board-h, --left-w,
       --panel-w and --caption-h are fitted to the window by ui.js fitSpread:
       the board takes all the room it can, and the right page what is left.
       One desktop layout, no breakpoints (CLAUDE.md rule 3). */
    :root {
      --paper: #F2E8D5;
      --ink: #1A1A18;
      --green: #5C6B4A;
      --red: #C1272D;
      --blue: #3D5A73;
      --leader: #2F7BBF;
      --typewriter: "Courier 10 Pitch", "Courier New", Courier, monospace;
      --slab: "Stardos Stencil", "Rockwell Condensed", Rockwell, "Courier New", serif;
      --paper-fibre: none;
      --paper-fibre-size: auto;
      --dots-ink: none;
      --dots-blue: none;
      --dots-red: none;
      --dots-green: none;
      --outer-gutter: 20px;
      --right-margin: 22px;
      --left-w: 1fr;
      --panel-w: 380px;
      --board-h: 520px;
      --caption-h: 92px;
      /* The page's age: browned edges and foxed corners, multiplied over it. */
      --edge-wear:
        radial-gradient(ellipse 30% 22% at 0 0, rgba(130, 90, 40, 0.20), transparent),
        radial-gradient(ellipse 26% 20% at 100% 100%, rgba(130, 90, 40, 0.18), transparent),
        radial-gradient(ellipse 18% 14% at 100% 0, rgba(130, 90, 40, 0.10), transparent),
        radial-gradient(circle 60px at 12% 88%, rgba(150, 110, 60, 0.08), transparent);
    }
    html, body {
      margin: 0;
      height: 100%;
      /* The table the annual lies open on. */
      background: #2d2b26;
      color: var(--ink);
      font-family: var(--typewriter);
    }
    button { font-family: var(--typewriter); }

    #spread {
      box-sizing: border-box;
      height: 100%;
      min-width: 1280px;
      min-height: 760px;
      padding: 8px var(--right-margin) 8px 8px;
      display: grid;
      grid-template-columns: var(--left-w) var(--panel-w);
      justify-content: center;
    }
    .page {
      position: relative;
      box-sizing: border-box;
      min-height: 0;
      min-width: 0;
      background-color: var(--paper);
    }
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--edge-wear);
      box-shadow: inset 0 0 36px rgba(110, 80, 40, 0.22);
      mix-blend-mode: multiply;
    }
    /* The centre fold: each page darkens toward the crease, with a thin
       highlight where the paper rises out of it. */
    #left-page {
      display: grid;
      grid-template-columns: var(--outer-gutter) minmax(0, 1fr);
      gap: 4px;
      padding: 10px 16px 10px 2px;
      background-image:
        linear-gradient(to right, transparent calc(100% - 22px), rgba(70, 50, 25, 0.10) calc(100% - 10px), rgba(40, 28, 12, 0.42) calc(100% - 1px), rgba(255, 250, 235, 0.5)),
        var(--paper-fibre);
      background-size: auto, var(--paper-fibre-size);
      box-shadow: -3px 3px 0 rgba(0, 0, 0, 0.5);
    }
    #panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 10px 18px;
      overflow: hidden;
      font-size: 14px;
      background-image:
        linear-gradient(to left, transparent calc(100% - 22px), rgba(70, 50, 25, 0.10) calc(100% - 10px), rgba(40, 28, 12, 0.36)),
        var(--paper-fibre);
      background-size: auto, var(--paper-fibre-size);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
    }

    /* The outer margin: the cut-out note and the seed (SPEC.md §1). */
    #outer-gutter {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }
    #gutter-note {
      flex: 1 1 auto;
      min-height: 0;
      width: var(--outer-gutter);
    }
    #seed {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 11px;
      padding: 4px 0;
    }
    #seed a { color: inherit; opacity: 0.6; }

    #left-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }
    #board {
      flex: 0 0 auto;
      display: block;
      width: 100%;
      height: var(--board-h);
    }

    /* Comic caption boxes: paper, an ink rule and a hard offset shadow. */
    .caption {
      box-sizing: border-box;
      margin: 0;
      padding: 5px 9px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .caption-head {
      margin: -5px -9px 5px;
      padding: 2px 9px;
      font-family: var(--slab);
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    /* Under the board, side by side: the hover readout, which is the risk
       display (SPEC.md §4) and always shown, and the turn report. Their
       height is fixed by fitSpread, never by their text, so the board does
       not rescale under the mouse; ui.js renderReadout puts warnings first,
       so anything cut off is terrain detail, never a risk. */
    #captions {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      height: var(--caption-h);
      padding: 0 3px 3px 0;
      box-sizing: border-box;
    }
    #coord-readout {
      flex: 3 1 0;
      min-width: 0;
      font-size: 15px;
      line-height: 20px;
      overflow: hidden;
    }
    #report {
      flex: 2 1 0;
      min-width: 0;
      overflow-y: auto;
      list-style: none;
      font-size: 14px;
      line-height: 1.35;
    }
    #report li { padding: 0 3px; }
    #report li + li { margin-top: 2px; }
    #report li.located { cursor: default; }
    #report li.located:hover { background: var(--ink); color: var(--paper); }

    #error {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* The fixed strip at the top of the right page: the clock, End turn and
       the selected man's actions (SPEC.md §11 layout notes). */
    #strip {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #clock {
      display: flex;
      align-items: stretch;
      gap: 6px;
      height: 32px;
    }
    #turn-counter {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
      background: var(--paper);
      border: 2px solid var(--ink);
    }
    #turn-counter.dawn { color: var(--paper); background: var(--red); }
    #dawn-strip {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    #keys-tab {
      flex: 0 0 auto;
      padding: 0 7px;
      font-size: 13px;
      font-weight: bold;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      cursor: help;
    }
    .btn, #end-turn, #diversion, .action {
      font-family: var(--typewriter);
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
    }
    /* Pressed in one step, no easing. */
    .btn:active:not(:disabled), #end-turn:active:not(:disabled), #diversion:active:not(:disabled), .action:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    #end-turn {
      padding: 5px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      background-image: var(--dots-red);
      background-color: var(--paper);
    }
    #end-turn:disabled, #diversion:disabled, .action:disabled {
      color: rgba(26, 26, 24, 0.5);
      background-image: var(--dots-ink);
      box-shadow: none;
      border-color: rgba(26, 26, 24, 0.45);
      cursor: default;
    }
    /* Room for three rows of buttons, the most any man has, so selecting a
       man never shifts the page. The drop's three runs are one row, and the
       page closes up under them rather than leaving the rest empty. */
    #actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      min-height: 98px;
      align-content: start;
    }
    #actions.runs { min-height: 0; }
    #actions.idle {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.6;
      border: 2px dashed rgba(26, 26, 24, 0.35);
    }
    .action-wrap { display: flex; min-width: 0; }
    .action-wrap .action { flex: 1 1 auto; min-width: 0; }
    .action:disabled { pointer-events: none; }
    .action {
      display: flex;
      align-items: center;
      height: 29px;
      padding: 0 4px;
      text-align: left;
    }
    .action.active {
      color: var(--paper);
      background: var(--blue);
    }
    .action-key {
      flex: 0 0 auto;
      min-width: 11px;
      margin-right: 5px;
      padding: 0 3px;
      font-size: 12px;
      font-weight: bold;
      line-height: 17px;
      text-align: center;
      color: var(--paper);
      background: var(--ink);
    }
    .action:disabled .action-key { background: rgba(26, 26, 24, 0.45); }
    .action.active .action-key { color: var(--blue); background: var(--paper); }
    .action-name {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* The dial, its state, and beside them the one thing that moves the dial
       down: the RAF diversion. */
    #alert-row {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    #alert {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: help;
    }
    #alert-dial {
      flex: 0 0 76px;
      width: 76px;
      height: 76px;
    }
    .alert-heading {
      font-family: var(--slab);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .alert-state {
      display: inline-block;
      margin: 2px 0;
      padding: 0 6px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--paper);
    }
    .alert-note { font-size: 13px; }

    #mission-box { flex: 0 0 auto; }
    #mission {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 14px;
      line-height: 1.45;
    }
    #mission li { display: flex; gap: 6px; }
    #mission li span:first-child { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mission li span:last-child { flex: 0 0 auto; }
    #mission .done span:first-child { text-decoration: line-through; text-decoration-color: var(--red); }
    #mission i { font-style: normal; opacity: 0.65; }
    #diversion {
      flex: 0 0 104px;
      padding: 4px 5px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.25;
      color: var(--paper);
      background: var(--blue);
    }
    #diversion small { display: block; font-size: 12px; font-weight: normal; }
    /* Not available yet: printed in blue on the paper rather than faded ink
       on blue, which could not be read. */
    #diversion:disabled {
      color: var(--blue);
      background: var(--paper);
      border: 2px dashed var(--blue);
    }

    /* The roster rail (SPEC.md §11): all six, always visible, greying out as
       men are lost. One row each — a small portrait and four lines about the
       man — sharing whatever height the page has left. The full particulars,
       with a bigger portrait, are each row's rollover. */
    #roster {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 0 3px 3px 0;
      list-style: none;
      display: grid;
      grid-auto-rows: minmax(0, 1fr);
      gap: 5px;
    }
    .slot {
      position: relative;
      display: flex;
      gap: 9px;
      min-height: 0;
      padding: 2px 6px 2px 2px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      overflow: hidden;
    }
    .slot.selected { border-color: var(--red); box-shadow: 2px 2px 0 var(--red); outline: 1px solid var(--red); }
    .slot-face {
      position: relative;
      flex: 0 0 auto;
      height: 100%;
      aspect-ratio: 4 / 5;
      border: 1px solid var(--ink);
      box-sizing: border-box;
      overflow: hidden;
    }
    .slot-face svg { display: block; width: 100%; height: 100%; }
    .slot.lost { cursor: default; }
    .slot.lost .slot-face svg { filter: grayscale(1) contrast(0.7); opacity: 0.45; }
    .slot.lost .slot-text { opacity: 0.55; }
    .slot-num {
      position: absolute;
      top: 0;
      left: 0;
      padding: 0 5px;
      font-weight: bold;
      font-size: 13px;
      color: var(--paper);
      background: var(--ink);
    }
    .slot.leader .slot-num { background: var(--leader); }
    .slot-text {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 13px;
      line-height: 16px;
    }
    .slot-name {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .slot-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-name span:last-child { flex: 0 0 auto; }
    .slot-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-warn { color: var(--red); font-weight: bold; }
    .slot-trait { opacity: 0.7; }

    /* The results: the back page of the annual (SPEC.md §10), printed over
       the right page, the board still open beside it. */
    #results {
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 12px 14px 12px 22px;
      overflow-y: auto;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      font-size: 14px;
    }
    #results .logo { display: block; width: 100%; height: 110px; }
    #results .kicker {
      font-family: var(--slab);
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 11px;
      text-align: center;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      margin: 4px 0 8px;
    }
    #results h2 {
      margin: 0 0 4px;
      font-family: var(--slab);
      font-size: 24px;
      letter-spacing: 1px;
    }
    #results.success h2 { color: var(--green); }
    #results.withdrawn h2 { color: var(--blue); }
    #results.failed h2 { color: var(--red); }
    #results p { margin: 0 0 8px; }
    #results .fates { list-style: none; margin: 0 0 8px; padding: 0; }
    #results .fates li { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    #results .fates svg { width: 22px; height: 22px; flex: 0 0 22px; }
    #results .fate-lost svg { filter: grayscale(1); opacity: 0.5; }
    #results .fate-lost b { color: var(--red); }
    #results table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    #results td:last-child { text-align: right; }
    #results .total td { border-top: 2px solid var(--ink); font-weight: bold; font-size: 14px; }
    #results button { padding: 4px 12px; font-size: 13px; font-weight: bold; }

    /* The briefing card (SPEC.md §11): the orders before the drop and an update
       at the start of each turn, over the board. Any key or click puts it away. */
    #briefing-backdrop {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 24, 0.28);
      cursor: pointer;
    }
    #briefing-backdrop[hidden] { display: none; }
    #briefing {
      box-sizing: border-box;
      width: min(600px, 80%);
      max-height: 96%;
      overflow: hidden;
      padding: 0 18px 12px;
      font-size: 15px;
      line-height: 1.45;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      cursor: default;
    }
    /* The title card over the orders: 4:1 art, the title set over it. The
       scrim under the title keeps it legible over whatever is painted there. */
    #briefing .brief-banner {
      position: relative;
      margin: 0 -18px;
      aspect-ratio: 4 / 1;
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
      background: var(--blue);
    }
    #briefing .brief-banner-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #briefing .brief-banner-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      white-space: nowrap;
      font-family: var(--slab);
      font-size: 46px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--paper);
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 4px 4px 0 var(--red);
      background: radial-gradient(ellipse 48% 34% at 50% 50%, rgba(26, 26, 24, 0.45), rgba(26, 26, 24, 0));
    }
    /* A supplied title card with the title painted in: the typed title stays
       for screen readers but is not drawn over it (theme.js TITLE_CARD). */
    .title-card-lettered #briefing .brief-banner-title {
      clip-path: inset(50%);
      background: none;
    }
    #briefing .brief-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 -18px 10px;
      padding: 5px 18px;
      font-family: var(--slab);
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    #briefing .brief-title { font-size: 22px; }
    #briefing .brief-kicker { font-size: 13px; opacity: 0.8; }
    #briefing h3 {
      margin: 10px 0 4px;
      font-family: var(--slab);
      font-size: 14px;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--ink);
    }
    #briefing p { margin: 0 0 8px; }
    /* A clear line between the orders' prose and the section under it. */
    #briefing p + h3 { margin-top: 22px; }
    #briefing ul { margin: 0; padding: 0; list-style: none; }
    #briefing li { position: relative; padding-left: 16px; margin-bottom: 3px; }
    #briefing li::before { content: "▸"; position: absolute; left: 0; }
    #briefing .brief-hints li::before { content: "→"; color: var(--red); font-weight: bold; }
    #briefing .brief-more { opacity: 0.65; }
    #briefing .brief-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
    }
    #briefing .brief-foot label { cursor: pointer; }
    #briefing .brief-go {
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Rollovers (SPEC.md §11): detail kept off the page until asked for. */
    #popup {
      position: fixed;
      z-index: 20;
      max-width: 420px;
      padding: 6px 9px;
      font-family: var(--typewriter);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      pointer-events: none;
      white-space: pre-line;
    }
    #popup b { font-size: 15px; }
    #popup .popup-portrait {
      float: left;
      width: 96px;
      height: 120px;
      margin: 2px 9px 2px 0;
      border: 2px solid var(--ink);
    }
  </style>
</head>
<body>
  <main id="spread">
    <section id="left-page" class="page">
      <div id="outer-gutter">
        <svg id="gutter-note" viewBox="0 0 60 900" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="seed"></div>
      </div>
      <div id="briefing-backdrop" hidden><section id="briefing" role="dialog" aria-modal="true"></section></div>
      <div id="left-content">
        <svg id="board"></svg>
        <div id="captions">
          <div id="coord-readout" class="caption">Loading map…</div>
          <ul id="report" class="caption"></ul>
        </div>
      </div>
    </section>
    <aside id="panel" class="page">
      <div id="strip">
        <div id="clock">
          <div id="turn-counter"></div>
          <svg id="dawn-strip" viewBox="0 0 600 60" preserveAspectRatio="none"></svg>
          <button id="keys-tab" type="button">KEYS</button>
        </div>
        <button id="end-turn" type="button"></button>
        <div id="actions"></div>
      </div>
      <div id="alert-row">
        <div id="alert">
          <svg id="alert-dial" viewBox="0 0 240 240"></svg>
          <div id="alert-caption"></div>
        </div>
        <button id="diversion" type="button"></button>
      </div>
      <div id="mission-box" class="caption">
        <div class="caption-head">MISSION BRIEFING</div>
        <ul id="mission"></ul>
      </div>
      <ul id="roster"></ul>
      <section id="results" hidden></section>
    </aside>
  </main>
  <div id="error" hidden></div>
  <div id="popup" hidden></div>
  <!--
    Failure reporting. This is a classic script, not a module, and it runs
    before the game does, so it still works when the module itself is what
    failed. Without it, a module that will not load or link leaves the page
    sitting on "Loading map…" with nothing said out loud — which is exactly
    the guessing game the loud data errors in map.js exist to prevent.
  -->
  <script>
    (function () {
      var box = document.getElementById('error');
      var started = false; // src/main.js began executing
      var ready = false;   // …and got all the way through its first render

      function report(what, detail) {
        box.hidden = false;
        box.textContent = what + '\n\n' + detail
          + '\n\nBrowser: ' + navigator.userAgent;
      }

      // Opened by double-clicking the file rather than through ./run.sh.
      // Browsers block ES modules over file:// (SPEC.md §1), so the page
      // renders its static furniture and the game never loads at all. Say so
      // at once — the symptoms otherwise look like a broken game.
      if (location.protocol === 'file:') {
        report('This page was opened as a file, so the game cannot run.',
          'Browsers refuse to load ES modules over file://, which is why the\n'
          + 'board is empty and the keys do nothing. Nothing is wrong with the game.\n\n'
          + 'Start the server and use the address it prints:\n\n'
          + '    ./run.sh\n'
          + '    http://localhost:8000');
        return;
      }

      // The page is not ours alone: browser extensions inject scripts into it
      // and throw their own failures at these same listeners. Blaming the game
      // for MetaMask's connection error is worse than saying nothing, because
      // it sends whoever is debugging into the wrong file entirely.
      function notOurs(where) {
        return /-extension:\/\//.test(where || '');
      }

      // Once the game is running, only failures traceable to our own files are
      // worth a banner over the board. Before it is running, report anything
      // that is not plainly a guest: at that point nothing else should be
      // failing, and a false negative costs more than a false positive.
      function ignore(where) {
        if (notOurs(where)) return true;
        return ready && where.indexOf(location.origin) === -1;
      }

      window.addEventListener('error', function (event) {
        // Subresource failures (a module that 404s) arrive as an error event
        // on the element and carry no message, so say which one it was.
        if (event.target && event.target !== window && event.target.src) {
          if (notOurs(event.target.src)) return;
          report('A script failed to load.', event.target.src);
          return;
        }
        var where = (event.filename || '') + ':' + (event.lineno || '?');
        if (ignore(where)) return;
        report(ready ? 'The game hit an error.' : 'The game threw before it could start.',
          (event.message || 'Unknown error') + '\n' + where);
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var detail = (reason && (reason.stack || reason.message)) || String(reason);
        if (ignore(detail)) return;
        report(ready ? 'The game hit an error.' : 'The game failed while starting.', detail);
      });

      // Nothing above fires for a module the browser refuses to run at all,
      // so also notice that the game simply never started.
      window.addEventListener('night-drop-started', function () { started = true; });
      window.addEventListener('night-drop-ready', function () { ready = true; });
      setTimeout(function () {
        if (started || !box.hidden) return;
        report('The game never started.',
          'index.html loaded but src/main.js did not run. Usually this means the\n'
          + 'browser could not parse a module, or the page was opened over file://\n'
          + 'instead of through ./run.sh. Check the browser console for the reason.');
      }, 3000);
    }());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
