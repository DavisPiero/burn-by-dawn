<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Drop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a18;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      min-width: 1280px;
      min-height: 800px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    #coord-readout {
      font-family: monospace;
      font-size: 14px;
    }
    #error {
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      margin: 0;
      padding: 0;
      max-width: 1400px;
      list-style: none;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #1a1a18;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
    }
    #board {
      width: 100%;
      max-width: 1400px;
      height: auto;
      background: #2a2a26;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>NIGHT DROP — M1: terrain</h1>
    <div id="error" hidden></div>
    <div id="coord-readout">Loading map…</div>
    <ul id="legend"></ul>
    <svg id="board"></svg>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
