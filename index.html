<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Burn by Dawn</title>
  <style>
    /* The game is a double-page spread from an 80s comic annual (SPEC.md §11):
       the board on the left page, the clock, briefing, dial and roster rail
       on the right. Colours, paper and type come from src/render/theme.js,
       which sets the custom properties below at startup; the values here are
       only what shows before it runs. The sizes in --board-h, --left-w,
       --panel-w and --caption-h are fitted to the window by ui.js fitSpread:
       the board takes all the room it can, and the right page what is left.
       One desktop layout, no breakpoints (CLAUDE.md rule 3). */
    :root {
      --paper: #F2E8D5;
      --ink: #1A1A18;
      --green: #5C6B4A;
      --red: #C1272D;
      --blue: #3D5A73;
      --leader: #2F7BBF;
      --fire: #C98249;
      --typewriter: "Courier 10 Pitch", "Courier New", Courier, monospace;
      --slab: "Stardos Stencil", "Rockwell Condensed", Rockwell, "Courier New", serif;
      --paper-fibre: none;
      --paper-fibre-size: auto;
      /* Paper with its fibre printed faintly (M16, the operator's: the flat
         boxes read as too digital): the fibre under a veil of paper. */
      --paper-faint: linear-gradient(color-mix(in srgb, var(--paper) 55%, transparent), color-mix(in srgb, var(--paper) 55%, transparent)), var(--paper-fibre) 0 0 / var(--paper-fibre-size) var(--paper);
      --dots-ink: none;
      --dots-blue: none;
      --dots-red: none;
      --dots-green: none;
      --outer-gutter: 20px;
      --right-margin: 22px;
      --left-w: 1fr;
      --panel-w: 380px;
      --board-h: 520px;
      --caption-h: 92px;
      /* The page's age: browned edges and foxed corners, multiplied over it. */
      --edge-wear:
        radial-gradient(ellipse 30% 22% at 0 0, rgba(130, 90, 40, 0.20), transparent),
        radial-gradient(ellipse 26% 20% at 100% 100%, rgba(130, 90, 40, 0.18), transparent),
        radial-gradient(ellipse 18% 14% at 100% 0, rgba(130, 90, 40, 0.10), transparent),
        radial-gradient(circle 60px at 12% 88%, rgba(150, 110, 60, 0.08), transparent);
    }
    html, body {
      margin: 0;
      height: 100%;
      /* The table the annual lies open on. */
      background: #2d2b26;
      color: var(--ink);
      font-family: var(--typewriter);
    }
    button { font-family: var(--typewriter); }

    #spread {
      box-sizing: border-box;
      height: 100%;
      min-width: 1280px;
      min-height: 760px;
      padding: 8px var(--right-margin) 8px 8px;
      display: grid;
      grid-template-columns: var(--left-w) var(--panel-w);
      justify-content: center;
    }
    /* A window smaller than the spread (1280x760) gets the same spread zoomed
       down to fit, by ui.js fitSpread (M12b) — no second layout. */
    html.scaled #spread {
      zoom: var(--spread-zoom);
      width: var(--spread-w);
      height: var(--spread-h);
    }
    .page {
      position: relative;
      box-sizing: border-box;
      min-height: 0;
      min-width: 0;
      background-color: var(--paper);
    }
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--edge-wear);
      box-shadow: inset 0 0 36px rgba(110, 80, 40, 0.22);
      mix-blend-mode: multiply;
    }
    /* The centre fold: each page darkens toward the crease, with a thin
       highlight where the paper rises out of it. */
    #left-page {
      display: grid;
      grid-template-columns: var(--outer-gutter) minmax(0, 1fr);
      gap: 4px;
      padding: 10px 16px 10px 2px;
      background-image:
        linear-gradient(to right, transparent calc(100% - 22px), rgba(70, 50, 25, 0.10) calc(100% - 10px), rgba(40, 28, 12, 0.42) calc(100% - 1px), rgba(255, 250, 235, 0.5)),
        var(--paper-fibre);
      background-size: auto, var(--paper-fibre-size);
      box-shadow: -3px 3px 0 rgba(0, 0, 0, 0.5);
    }
    #panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 10px 18px;
      overflow: hidden;
      font-size: 14px;
      background-image:
        linear-gradient(to left, transparent calc(100% - 22px), rgba(70, 50, 25, 0.10) calc(100% - 10px), rgba(40, 28, 12, 0.36)),
        var(--paper-fibre);
      background-size: auto, var(--paper-fibre-size);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
    }

    /* The outer margin: the cut-out note and the seed (SPEC.md §1). */
    #outer-gutter {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }
    /* The game's name up the top of the margin, as a magazine prints its
       title in the margin (M14; twice the size and darker since M15). */
    #margin-title {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      /* Capitals sit to one side of their line box; this centres their ink
         between the page's edge and the board's frame (M16, measured). */
      position: relative;
      left: 3.5px;
      padding: 6px 0 4px;
      font-family: var(--slab);
      font-size: 22px;
      line-height: 1;
      letter-spacing: 3px;
      white-space: nowrap;
      color: var(--ink);
      opacity: 0.55;
      user-select: none;
    }
    #gutter-note {
      flex: 1 1 auto;
      min-height: 0;
      width: var(--outer-gutter);
    }
    #seed, #version {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 11px;
      padding: 4px 0;
    }
    #seed a, #version { color: inherit; opacity: 0.6; }
    /* Sound on or off, under the seed and set the same way. */
    #sound-toggle, #restart {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: 4px 0;
      font: inherit;
      font-size: 11px;
      color: inherit;
      opacity: 0.6;
      background: none;
      border: 0;
      text-decoration: underline;
      cursor: pointer;
    }
    /* RESTART in the bottom corner, dark and bold (M15), so it can be found. */
    #restart { opacity: 1; font-weight: bold; text-decoration: none; letter-spacing: 1px; }
    #restart.armed { color: var(--red); }
    /* The difficulty beside the seed: text, not a button to look at, but a
       click on it before the jump opens the orders where it is chosen. */
    #seed .seed-level {
      padding: 0;
      font: inherit;
      color: inherit;
      opacity: 0.6;
      background: none;
      border: 0;
      text-decoration: underline;
      cursor: pointer;
    }

    #left-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }
    #board {
      flex: 0 0 auto;
      display: block;
      width: 100%;
      height: var(--board-h);
    }
    /* The fibre printed faintly over the map too (M16, the operator's), as
       if the map were printed on the same paper. Display only: no clicks. */
    #left-content { position: relative; }
    #board-paper {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: var(--board-h);
      pointer-events: none;
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      opacity: 0.4;
    }

    /* Comic caption boxes: paper, an ink rule and a hard offset shadow. */
    .caption {
      box-sizing: border-box;
      margin: 0;
      padding: 5px 9px;
      background: var(--paper-faint);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .caption-head {
      margin: -5px -9px 5px;
      padding: 2px 9px;
      font-family: var(--slab);
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    /* Under the board, side by side: the hover readout, which is the risk
       display (SPEC.md §4) and always shown, and the turn report. Their
       height is fixed by fitSpread, never by their text, so the board does
       not rescale under the mouse; ui.js renderReadout puts warnings first,
       so anything cut off is terrain detail, never a risk. */
    #captions {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      height: var(--caption-h);
      padding: 0 3px 3px 0;
      box-sizing: border-box;
    }
    #coord-readout {
      flex: 3 1 0;
      min-width: 0;
      font-size: 15px;
      line-height: 20px;
      overflow: hidden;
    }
    /* The turn log in a box with its own scroll buttons down the right
       (M22, the operator's: the wheel alone was fiddly in so small a box). */
    #report-box {
      flex: 2 1 0;
      min-width: 0;
      display: flex;
      padding: 0;
    }
    #report {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      padding: 5px 6px 5px 9px;
      overflow-y: auto;
      scrollbar-width: none;
      list-style: none;
      font-size: 14px;
      line-height: 1.35;
    }
    #report::-webkit-scrollbar { display: none; }
    #report-scroll {
      flex: 0 0 26px;
      display: flex;
      flex-direction: column;
      border-left: 2px solid var(--ink);
    }
    #report-scroll[hidden] { display: none; }
    #report-scroll button {
      flex: 1 1 0;
      padding: 0;
      font-size: 13px;
      line-height: 1;
      color: var(--ink);
      background: var(--paper-faint);
      border: 0;
      cursor: pointer;
    }
    #report-scroll button + button { border-top: 2px solid var(--ink); }
    #report-scroll button:hover:not(:disabled) { color: var(--paper); background: var(--ink); }
    #report-scroll button:disabled { opacity: 0.25; cursor: default; }
    #report li { padding: 0 3px; }
    /* The hover readout in rows (M21b): a headline and a stamp, then each
       thing under a short label. */
    #coord-readout.rows { font-size: 14px; line-height: 18px; }
    /* Stepped down to fit the box (M22, ui.js renderRows), never below 12px. */
    #coord-readout.rows[data-fit="13"] { font-size: 13px; line-height: 16px; }
    #coord-readout.rows[data-fit="12"] { font-size: 12px; line-height: 15px; }
    #coord-readout .ro-head { display: flex; flex-wrap: wrap; align-items: center; column-gap: 10px; margin-bottom: 2px; }
    #coord-readout .ro-note { margin-left: auto; font-size: 12px; opacity: 0.7; white-space: nowrap; }
    #coord-readout .ro-title { font-family: var(--slab); font-size: 16px; font-weight: bold; letter-spacing: 1.5px; }
    #coord-readout .ro-stamp {
      padding: 0 5px;
      border: 2px solid currentColor;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      line-height: 15px;
      transform: rotate(-2deg);
    }
    #coord-readout .ro-stamp.safe { color: var(--green); }
    #coord-readout .ro-stamp.warn { color: var(--ink); }
    #coord-readout .ro-stamp.danger { color: var(--red); }
    #coord-readout .ro-body { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row dense; column-gap: 16px; row-gap: 1px; }
    #coord-readout .ro-row { grid-column: 1 / -1; display: grid; grid-template-columns: 62px 1fr; column-gap: 6px; }
    #coord-readout .ro-row.half { grid-column: auto; }
    #coord-readout .ro-label { font-size: 12px; font-weight: bold; letter-spacing: 1px; opacity: 0.6; }
    #coord-readout .ro-row.danger .ro-text { color: var(--red); }
    #coord-readout .ro-row.danger .ro-label { color: var(--red); opacity: 1; }
    /* A use open right now, Stabilise or Pass (M26): in the orders' blue. */
    #coord-readout .ro-row.prompt .ro-text { color: var(--blue); font-weight: bold; }
    #coord-readout .ro-row.prompt .ro-label { color: var(--blue); opacity: 1; }
    /* The report as a log (M21b): a bar per turn, a mark per line, the news
       graded by colour, the turns before faded. */
    #report li.rep-turn {
      margin: 0 0 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: var(--paper);
      background: var(--ink);
    }
    #report li.rep-turn.old { margin-top: 6px; }
    #report li + li.rep-turn { margin-top: 6px; }
    #report li:not(.rep-turn) { display: grid; grid-template-columns: 16px 1fr; column-gap: 5px; align-items: start; }
    #report li.rep-none { display: block; color: rgba(26, 26, 24, 0.62); }
    #report li.rep-note { display: block; }
    #report .rep-mark { width: 16px; height: 16px; margin-top: 1px; }
    #report .rep-dot { fill: var(--ink); opacity: 0.5; }
    #report li.rep-grave .rep-text { color: var(--red); font-weight: bold; }
    #report li.rep-quiet .rep-text { color: rgba(26, 26, 24, 0.62); }
    #report li.old { opacity: 0.5; }
    /* One of ours dead, in the report and on the turn card (M13). */
    b.killed { color: var(--red); }
    #report li + li { margin-top: 2px; }
    #report li.located { cursor: default; }
    #report li.located:hover { background: var(--ink); color: var(--paper); }

    #error {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* The fixed strip at the top of the right page: the clock, End turn and
       the selected man's actions (SPEC.md §11 layout notes). */
    #strip {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #clock {
      display: flex;
      align-items: stretch;
      gap: 6px;
      height: 32px;
    }
    /* The clock, in the stencil and large, so it is not lost in the strip (M12). */
    #turn-counter {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-family: var(--slab);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
      background: var(--paper-faint);
      border: 2px solid var(--ink);
    }
    #turn-counter.dawn { color: var(--paper); background: var(--red); }
    #dawn-strip {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    /* A tab to hover, raised like the buttons so it does not read as a label (M12). */
    #keys-tab, #help-tab {
      flex: 0 0 auto;
      padding: 0 7px;
      font-family: var(--typewriter);
      font-size: 13px;
      font-weight: bold;
      color: var(--ink);
      background: var(--paper-faint);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: help;
    }
    /* How to play, at any time (M16): the orders again, as a question mark. */
    #help-tab { font-size: 16px; padding: 0 9px; cursor: pointer; }
    /* End turn and Undo side by side; Undo takes only the room it needs. */
    #turn-row { display: flex; gap: 6px; }
    #turn-row #end-turn { flex: 1 1 auto; }
    #undo {
      flex: 0 0 auto;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: bold;
    }
    #undo[hidden] { display: none; }
    .btn, #end-turn, #diversion, .action, #undo {
      font-family: var(--typewriter);
      color: var(--ink);
      background: var(--paper-faint);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
    }
    /* Pressed in one step, no easing. */
    .btn:active:not(:disabled), #end-turn:active:not(:disabled), #undo:active:not(:disabled), #diversion:active:not(:disabled), .action:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    #end-turn {
      padding: 5px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      background-image: var(--dots-red);
      background-color: var(--paper);
    }
    /* The jump, once a run is picked (M21): danger red, throbbing. */
    #end-turn.jump {
      color: var(--paper);
      background-color: var(--red);
      background-image: none;
      animation: jump-throb 1400ms ease-in-out infinite;
    }
    @keyframes jump-throb { 50% { transform: scale(1.03); } }
    #end-turn:disabled, #diversion:disabled, .action:disabled, #undo:disabled {
      color: rgba(26, 26, 24, 0.5);
      background-image: var(--dots-ink);
      box-shadow: none;
      border-color: rgba(26, 26, 24, 0.45);
      cursor: default;
    }
    /* Room for three rows of buttons, the most any man has, so selecting a
       man never shifts the page. The drop's three runs are one row, and the
       page closes up under them rather than leaving the rest empty. */
    #actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      min-height: 98px;
      align-content: start;
    }
    #actions.runs { min-height: 0; }
    #actions.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    #actions.four .action-key { margin-right: 5px; padding: 0 2px; }
    #actions.four .action { padding: 0 2px; }
    #actions.four .action-name { font-size: 12px; }
    #actions.idle {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.6;
      border: 2px dashed rgba(26, 26, 24, 0.35);
    }
    .action-wrap { display: flex; min-width: 0; }
    .action-wrap .action { flex: 1 1 auto; min-width: 0; }
    .action:disabled { pointer-events: none; }
    .action {
      display: flex;
      align-items: center;
      height: 29px;
      padding: 0 4px;
      text-align: left;
    }
    .action.active {
      color: var(--paper);
      background: var(--blue);
    }
    /* Stabilise or Pass is open to this man right now (M26): the End turn
       button's red dots, so it reads as "this one". Still until pressed. */
    .action.suggest:not(.active) {
      background-image: var(--dots-red);
      background-color: var(--paper);
      border-color: var(--red);
      box-shadow: 2px 2px 0 var(--red);
    }
    .action.suggest:not(.active) .action-key { background: var(--red); }
    .action-key {
      flex: 0 0 auto;
      min-width: 11px;
      margin-right: 8px;
      padding: 0 3px;
      font-size: 12px;
      font-weight: bold;
      line-height: 17px;
      text-align: center;
      color: var(--paper);
      background: var(--ink);
    }
    .action:disabled .action-key { background: rgba(26, 26, 24, 0.45); }
    .action.active .action-key { color: var(--blue); background: var(--paper); }
    /* A drop run's button: its name, and under it its word (data/map.json
       tag) in red. Taller than an action's, as the runs have the row alone. */
    #actions.runs .action { height: auto; padding: 3px 4px; }
    .action-words { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
    /* An action's AP under its name (M19, the operator's), both on the
       button's one line height. */
    #actions:not(.runs) .action-words { line-height: 1.02; }
    .action-cost { font-size: 12px; white-space: nowrap; }
    .action-tag {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--red);
    }
    .action.active .action-tag { color: var(--paper); }
    .action.struck .action-words { text-decoration: line-through; text-decoration-thickness: 2px; }
    .action.danger:not(:disabled) .action-cost { color: var(--red); font-weight: bold; }
    .actions-heading {
      grid-column: 1 / -1; align-self: center; text-align: center;
      font-weight: bold; letter-spacing: 0.04em; color: var(--red);
    }
    .action-name {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* The dial, its state, and beside them the one thing that moves the dial
       down: the RAF diversion. */
    #alert-row {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    #alert {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: help;
    }
    #alert-dial {
      flex: 0 0 76px;
      width: 76px;
      height: 76px;
    }
    .alert-heading {
      font-family: var(--slab);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .alert-state {
      display: inline-block;
      margin: 2px 0;
      padding: 0 6px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--paper);
    }
    .alert-note { font-size: 12px; white-space: nowrap; }
    /* One pip per alert point, grouped by state (ui.js renderAlertDial). */
    .alert-level { display: flex; align-items: center; gap: 8px; }
    .alert-pips { display: flex; gap: 2px; }
    .alert-pips .pip {
      width: 11px;
      height: 11px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      box-sizing: border-box;
    }
    .alert-pips .pip.gap { margin-left: 6px; }

    #mission-box { flex: 0 0 auto; }
    #mission {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 14px;
      line-height: 1.45;
    }
    #mission li { display: flex; gap: 6px; }
    #mission li span:first-child { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mission li span:last-child { flex: 0 0 auto; }
    #mission .done span:first-child { text-decoration: line-through; text-decoration-color: var(--red); }
    #mission i { font-style: normal; opacity: 0.65; }
    #diversion {
      flex: 0 0 104px;
      padding: 4px 5px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.25;
      color: var(--paper);
      background: var(--blue);
    }
    #diversion small { display: block; font-size: 12px; font-weight: normal; }
    /* The team is in a pickle (M26d): the RAF in danger red, as the jump is. */
    #diversion.suggest { background-color: var(--red); box-shadow: 2px 2px 0 var(--ink); }
    /* Not available yet: printed in blue on the paper rather than faded ink
       on blue, which could not be read. */
    #diversion:disabled {
      color: var(--blue);
      background: var(--paper-faint);
      border: 2px dashed var(--blue);
    }

    /* The roster rail (SPEC.md §11): all six, always visible, greying out as
       men are lost. One row each — a small portrait and four lines about the
       man — sharing whatever height the page has left. The full particulars,
       with a bigger portrait, are each row's rollover. */
    #roster {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 0 3px 3px 0;
      list-style: none;
      display: grid;
      grid-auto-rows: minmax(0, 1fr);
      gap: 5px;
    }
    .slot {
      position: relative;
      display: flex;
      gap: 9px;
      min-height: 0;
      padding: 2px 6px 2px 2px;
      background: var(--paper-faint);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      overflow: hidden;
    }
    .slot.safe { cursor: default; background: var(--green); color: var(--paper); }
    .slot.safe .slot-text, .slot.safe .slot-line { font-weight: bold; }
    .slot.safe .slot-trait { opacity: 0.85; }
    .slot.selected { border-color: var(--red); box-shadow: 2px 2px 0 var(--red); outline: 1px solid var(--red); }
    .slot-face {
      position: relative;
      flex: 0 0 auto;
      height: 100%;
      aspect-ratio: 4 / 5;
      border: 1px solid var(--ink);
      box-sizing: border-box;
      overflow: hidden;
    }
    .slot-face svg { display: block; width: 100%; height: 100%; }
    .slot.lost { cursor: default; }
    .slot.lost .slot-face svg { filter: grayscale(1) contrast(0.7); opacity: 0.45; }
    .slot.lost .slot-text { opacity: 0.55; }
    .slot-num {
      position: absolute;
      top: 0;
      left: 0;
      padding: 0 5px;
      font-weight: bold;
      font-size: 13px;
      color: var(--paper);
      background: var(--ink);
    }
    .slot.leader .slot-num { background: var(--leader); }
    /* Stabilise or Pass is open to him (M26): its key, in red, on his portrait. */
    .slot-aid {
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 0 4px;
      font-weight: bold;
      font-size: 12px;
      line-height: 15px;
      color: var(--paper);
      background: var(--red);
    }
    .slot-text {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 13px;
      line-height: 16px;
    }
    .slot-name {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .slot-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-name span:last-child { flex: 0 0 auto; }
    .slot-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-warn { color: var(--red); font-weight: bold; }
    .slot-trait { opacity: 0.7; }

    /* The results: the back page of the annual (SPEC.md §10), printed over
       the right page, the board still open beside it. */
    #results {
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 12px 14px 12px 22px;
      overflow-y: auto;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      font-size: 14px;
    }
    /* The orders' title card, smaller: the tagline and title scaled to it. */
    #results .title-banner { border: 2px solid var(--ink); }
    #results .title-banner-title { font-size: 30px; letter-spacing: 3px; }
    #results .title-banner-tagline { padding: 8px 0 3px; font-size: 10px; letter-spacing: 2px; }
    #results .kicker {
      font-family: var(--slab);
      font-weight: bold;
      letter-spacing: 1.5px;
      white-space: nowrap;
      font-size: 11px;
      text-align: center;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      /* Air above the kicker and the result, so each reads on its own (M12). */
      margin: 20px 0 8px;
    }
    #results h2 {
      margin: 22px 0 4px;
      text-align: center;
      font-family: var(--slab);
      font-size: 24px;
      letter-spacing: 1px;
    }
    #results.success h2 { color: var(--green); }
    #results.withdrawn h2 { color: var(--blue); }
    #results.failed h2 { color: var(--red); }
    #results p { margin: 0 0 8px; }
    /* A blank line between the six and the score. */
    #results .fates { list-style: none; margin: 0 0 1.4em; padding: 0; }
    #results .fates li { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    #results .fates svg { width: 22px; height: 22px; flex: 0 0 22px; }
    #results .fate-lost svg { filter: grayscale(1); opacity: 0.5; }
    #results .fate-lost b { color: var(--red); }
    #results table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    #results td:last-child { text-align: right; }
    /* A little air above the rule, and between the rule and SCORE. */
    #results tr:nth-last-child(2) td { padding-bottom: 6px; }
    #results .total td {
      padding-top: 6px;
      border-top: 2px solid var(--ink);
      font-family: var(--slab);
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 1px;
    }
    #results .again { margin-top: 34px; text-align: center; }
    #results .again .btn + .btn { margin-left: 12px; }
    /* Set as SCORE and the result are (M12). */
    #results button {
      padding: 6px 24px;
      font-family: var(--slab);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* The briefing card (SPEC.md §11): the orders before the drop and an update
       at the start of each turn, over the board. Any key or click puts it away. */
    #briefing-backdrop {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 24, 0.28);
      cursor: pointer;
    }
    #briefing-backdrop[hidden] { display: none; }
    /* A turn card (or the diversion's) sits in the bottom right of the map,
       where the men seldom go, narrower and with nothing darkened, so what it
       reports can be seen beside it (M13). Any click still puts it away. */
    #briefing-backdrop:not(.orders) { background: none; }
    /* The board under a turn card takes the mouse (M23): a click on a man
       puts the card away and selects him (main.js clickThroughCard). */
    #briefing-backdrop.click-through { pointer-events: none; }
    #briefing-backdrop.click-through #briefing { pointer-events: auto; }
    /* Its foot 14 px above the board's (the left page's 10 px padding, then
       the board), its right 30 px in from the page's edge. */
    #briefing-backdrop:not(.orders) #briefing {
      position: absolute;
      right: 30px;
      bottom: calc(100% - 10px - var(--board-h) + 14px);
      width: min(500px, 62%);
      max-height: calc(var(--board-h) - 28px);
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.35;
      box-shadow: 5px 5px 0 var(--ink), 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    #briefing-backdrop:not(.orders) #briefing li { margin-bottom: 2px; }
    #briefing-backdrop:not(.orders) #briefing h3 { margin-top: 7px; }
    #briefing-backdrop:not(.orders) #briefing .brief-head { margin-bottom: 6px; }
    #briefing-backdrop:not(.orders) #briefing .brief-title { font-size: 19px; }
    #briefing-backdrop:not(.orders) #briefing .brief-foot { margin-top: 8px; font-size: 12px; }
    /* Under the orders the whole spread is put in shade, with a coarse
       halftone over it like a cheap print's shadow, and the card stands off
       it on a deep soft shadow (M12). A click anywhere on it carries on. */
    #briefing-backdrop.orders { background: none; }
    #briefing-backdrop.orders::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: rgba(26, 22, 16, 0.42);
      background-image: radial-gradient(circle, rgba(10, 8, 5, 0.38) 0.9px, transparent 1.5px);
      background-size: 5px 5px;
    }
    /* The orders: wider than a turn card, with more air between its parts (M13).
       800 since M22 (720 until then), the operator's: the job's line ends
       at the EXFIL and the bonus paragraph at "before dawn!" unbroken. */
    #briefing-backdrop.orders #briefing {
      width: min(800px, 94%);
      position: relative;
      box-shadow: 6px 6px 0 var(--ink), 0 16px 70px 12px rgba(0, 0, 0, 0.6);
    }
    #briefing {
      box-sizing: border-box;
      width: min(600px, 80%);
      max-height: 96%;
      overflow: hidden;
      padding: 0 18px 12px;
      font-size: 15px;
      line-height: 1.45;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      cursor: default;
    }
    /* The title card, heading the orders and the back page: 4:1 art, the
       title set over it, the tagline along its foot. The scrims keep both
       legible over whatever is painted there. */
    .title-banner {
      position: relative;
      aspect-ratio: 4 / 1;
      overflow: hidden;
      background: var(--blue);
    }
    #briefing .title-banner {
      margin: 0 -18px;
      border-bottom: 3px solid var(--ink);
    }
    .title-banner-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .title-banner-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      white-space: nowrap;
      font-family: var(--slab);
      font-size: 46px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--paper);
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 4px 4px 0 var(--red);
      background: radial-gradient(ellipse 48% 34% at 50% 50%, rgba(26, 26, 24, 0.45), rgba(26, 26, 24, 0));
    }
    /* A supplied title card with the title painted in: the typed title stays
       for screen readers but is not drawn over it (theme.js TITLE_CARD). */
    .title-card-lettered .title-banner-title {
      clip-path: inset(50%);
      background: none;
    }
    .title-banner-tagline {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 0 4px;
      font-family: var(--slab);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-align: center;
      white-space: nowrap;
      color: var(--paper);
      background: linear-gradient(to bottom, rgba(26, 26, 24, 0), rgba(26, 26, 24, 0.7));
    }
    #briefing .brief-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 -18px 10px;
      padding: 5px 18px;
      font-family: var(--slab);
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    /* Beside the orders, over the right page (M15): how to read a counter,
       as an insert card of its own. Any click on it carries on, as on the shade. */
    /* M16, the operator's: over the crease, as tall as what it holds, centred
       down the page. Never taller than the window: the drawing then scales
       down to fit. M17, the operator's: its middle on the crease itself (the
       backdrop's right edge), with the orders centred in the room left of it.
       A window too narrow for both (1280 wide) keeps the orders whole at the
       left and sets the key as near the crease as it can without covering
       them. --key-w, --orders-w and --orders-gap are the three sizes. */
    #briefing-backdrop.with-key {
      --key-w: 344px;
      --orders-w: min(800px, 94%);
      --orders-gap: 16px;
      --orders-left: max(12px, calc((100% - var(--key-w) / 2 - var(--orders-gap) - var(--orders-w)) / 2));
      justify-content: flex-start;
    }
    #briefing-backdrop.with-key #briefing { margin-left: var(--orders-left); }
    #counter-key {
      position: absolute;
      left: max(calc(100% - var(--key-w) / 2), calc(var(--orders-left) + var(--orders-w) + var(--orders-gap)));
      top: 50%;
      transform: translateY(-50%);
      /* Taller room since M21, for air above THE GARRISON and under the last
         line, keeping its type at the 12 px floor at 1280x800. */
      max-height: calc(100% - 16px);
      width: var(--key-w);
      box-sizing: border-box;
      padding: 0 12px 8px;
      display: flex;
      flex-direction: column;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      background-size: var(--paper-fibre-size);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink), 0 16px 70px 12px rgba(0, 0, 0, 0.6);
    }
    #counter-key[hidden] { display: none; }
    #counter-key .key-head {
      margin: 0 -12px 6px;
      padding: 7px 12px;
      font-family: var(--slab);
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    #counter-key svg { flex: 0 1 auto; min-height: 0; width: 100%; aspect-ratio: 344 / 776; }
    /* The orders (M15): the level in the black bar, the head under it in ink. */
    #briefing .brief-top.bar {
      margin: 0 -18px 6px;
      padding: 6px 18px;
      border-bottom: 0;
      color: var(--paper);
      background: var(--ink);
    }
    #briefing .brief-top.bar .btn { box-shadow: none; }
    #briefing .brief-head.plain {
      margin: 0 0 9px;
      padding: 0 0 3px;
      color: var(--ink);
      background: none;
      border-bottom: 2px solid var(--ink);
    }
    #briefing.tone-raf .brief-head { background: var(--blue); }
    /* The exfil's are-you-sure (M14): headed in danger red. */
    #briefing.tone-warn .brief-head { background: var(--red); }
    #briefing .brief-title { font-size: 22px; }
    #briefing .brief-kicker { font-size: 13px; opacity: 0.8; }
    #briefing h3 {
      margin: 10px 0 4px;
      font-family: var(--slab);
      font-size: 14px;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--ink);
    }
    #briefing p { margin: 0 0 8px; }
    /* A clear line between the orders' prose and the section under it. */
    #briefing p + h3 { margin-top: 14px; }
    #briefing ul { margin: 0; padding: 0; list-style: none; }
    #briefing li { position: relative; padding-left: 16px; margin-bottom: 3px; }
    #briefing li::before { content: "▸"; position: absolute; left: 0; }
    #briefing .brief-hints li::before { content: "→"; color: var(--red); font-weight: bold; }
    #briefing .brief-more { opacity: 0.65; }
    /* The difficulty on the orders (SPEC.md §10), in the foot where the
       turn cards keep their checkbox: the levels as buttons, the picked one
       inked in. What each changes is its rollover. */
    #briefing-backdrop.orders #briefing p { margin-bottom: 9px; }
    #briefing-backdrop.orders #briefing p + h3 { margin-top: 16px; }
    #briefing-backdrop.orders #briefing li { margin-bottom: 5px; }
    #briefing-backdrop.orders #briefing .brief-foot { margin-top: 12px; }
    /* Wider, so the picture is cropped lower rather than grown taller. */
    #briefing-backdrop.orders #briefing .title-banner { aspect-ratio: 5.8 / 1; }
    /* The level, first thing under the head: what it sets is in the text below. */
    #briefing .brief-top { margin: 0 0 7px; padding-bottom: 5px; border-bottom: 2px solid var(--ink); }
    #briefing .brief-choice {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #briefing .brief-choice-head {
      /* The stencil sits high in its line: down onto the buttons' middle (M12). */
      position: relative;
      top: 3px;
      margin-right: 4px;
      font-family: var(--slab);
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    /* Bigger since M14, the operator's: the first choice on the card. */
    #briefing .brief-choice .btn {
      padding: 3px 14px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #briefing .brief-choice .btn.active {
      color: var(--paper);
      background: var(--blue);
    }
    #briefing .brief-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
    }
    /* The box sits on the line's middle, so the label's words line up with
       CARRY ON beside it rather than dropping below it. */
    #briefing .brief-foot label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    /* The palette's army green, not the browser's blue. */
    #briefing .brief-foot input { margin: 0; accent-color: var(--green); }
    /* Music off on the orders (M22, the operator's: a near miss on the small
       box carried on and put the orders away): a bigger box, and the label
       padded out so the click lands on it. */
    #briefing-backdrop.orders #briefing .brief-foot label { padding: 4px 14px 4px 0; font-size: 14px; font-weight: bold; }
    #briefing-backdrop.orders #briefing .brief-foot input { width: 20px; height: 20px; }
    #briefing .brief-go {
      font-weight: bold;
      letter-spacing: 1px;
    }
    /* The contents page (M27): the annual's contents, one line a mission,
       its title run to its page number with a dotted leader. A mission not
       yet written is printed faint and stamped in red rubber, askew. */
    #briefing .contents { margin: 4px 0 0; padding: 0; list-style: none; }
    #briefing .contents-entry { position: relative; padding: 0; margin: 0 0 10px; }
    #briefing .contents-entry::before { content: none; }
    #briefing .contents-pick {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-sizing: border-box;
      width: 100%;
      padding: 7px 10px 8px;
      text-align: left;
      font: inherit;
      color: inherit;
      background: none;
      border: 2px solid transparent;
    }
    #briefing button.contents-pick { cursor: pointer; }
    /* A mission's panel (M31c): a small painting beside its line. */
    #briefing .contents-panel { flex: none; width: 150px; height: 100px; object-fit: cover; border: 2px solid var(--ink); box-sizing: border-box; }
    #briefing .contents-words { flex: 1; min-width: 0; display: block; }
    #briefing button.contents-pick:hover,
    #briefing button.contents-pick:focus-visible { border-color: var(--ink); box-shadow: 3px 3px 0 var(--red); outline: none; }
    #briefing .contents-line { display: flex; align-items: baseline; gap: 8px; }
    #briefing .contents-title,
    #briefing .contents-page {
      font-family: var(--slab);
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    #briefing .contents-leader { flex: 1; border-bottom: 3px dotted var(--ink); transform: translateY(-5px); }
    #briefing .contents-place { display: block; font-style: italic; font-weight: bold; }
    #briefing .contents-blurb { display: block; }
    #briefing .contents-entry.coming .contents-pick { opacity: 0.45; }
    #briefing .contents-stamp {
      position: absolute;
      right: 70px;
      top: 50%;
      padding: 2px 10px 0;
      font-family: var(--lettering);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--red);
      border: 3px solid var(--red);
      border-radius: 4px;
      transform: translateY(-50%) rotate(-7deg);
      opacity: 0.85;
      pointer-events: none;
    }

    /* Rollovers (SPEC.md §11): detail kept off the page until asked for. */
    #popup {
      position: fixed;
      z-index: 20;
      max-width: 420px;
      padding: 6px 9px;
      font-family: var(--typewriter);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--paper-faint);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      pointer-events: none;
      white-space: pre-line;
    }
    #popup b { font-size: 15px; }
    #popup .popup-cue { color: var(--red); }
    #popup .popup-portrait {
      float: left;
      width: 96px;
      height: 120px;
      margin: 2px 9px 2px 0;
      border: 2px solid var(--ink);
    }

    /* The loading page (M17): the table the annual lies on, with the title
       and a fuse burning down as the files arrive; when all is in, a line
       asks for a key or a click, and the spread comes up under it with the
       orders open. Until then the spread is laid out but not shown, so
       nothing is seen jumping into place. */
    #spread { opacity: 0; }
    html.opened #spread { opacity: 1; transition: opacity 450ms linear; }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: var(--paper);
      background:
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(242, 232, 213, 0.06), transparent),
        #2d2b26;
      cursor: default;
      user-select: none;
    }
    html.opened #loading { opacity: 0; pointer-events: none; transition: opacity 450ms linear; }
    html.loaded #loading { cursor: pointer; }
    .loading-title {
      font-family: var(--slab);
      font-size: 54px;
      font-weight: bold;
      letter-spacing: 8px;
      opacity: 0;
      text-shadow: 3px 3px 0 var(--red);
    }
    /* Set in its own stencil or not at all: no flash of a stand-in face. */
    html.fonts-ready .loading-title { opacity: 0.92; transition: opacity 400ms linear; }
    /* The fuse: its unburnt length shortens as the files come in, a spark
       where it burns. --loaded runs 0 to 1, set by main.js. */
    .loading-fuse {
      position: relative;
      width: 300px;
      height: 14px;
    }
    .loading-fuse::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      width: calc((1 - var(--loaded, 0)) * 100%);
      height: 2px;
      background: repeating-linear-gradient(to right, rgba(242, 232, 213, 0.55) 0 7px, transparent 7px 10px);
    }
    .loading-fuse::after {
      content: "";
      position: absolute;
      top: 1px;
      left: calc((1 - var(--loaded, 0)) * 100% - 6px);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6d8 0 2px, var(--fire) 3px, rgba(201, 130, 73, 0) 6px);
      animation: fuse-spark 180ms steps(2) infinite;
    }
    html.loaded .loading-fuse::after { display: none; }
    @keyframes fuse-spark { 50% { transform: scale(1.35); } }
    .loading-note {
      font-family: var(--typewriter);
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
    .loading-note .ready { display: none; font-weight: bold; opacity: 1; }
    html.loaded .loading-note { opacity: 0.95; }
    html.loaded .loading-note .wait { display: none; }
    html.loaded .loading-note .ready { display: inline; }
  </style>
</head>
<body>
  <main id="spread">
    <section id="left-page" class="page">
      <div id="outer-gutter">

  <div id="loading" role="status">

  </div>
  <div id="error" hidden></div>
  <div id="popup" hidden></div>
  <!--
    Failure reporting. This is a classic script, not a module, and it runs
    before the game does, so it still works when the module itself is what
    failed. Without it, a module that will not load or link leaves the page
    sitting on "Loading map…" with nothing said out loud — which is exactly
    the guessing game the loud data errors in map.js exist to prevent.
  -->
  <script>
    (function () {
      var box = document.getElementById('error');
      var started = false; // src/main.js began executing
      var ready = false;   // …and got all the way through its first render

      function report(what, detail) {
        box.hidden = false;
        box.textContent = what + '\n\n' + detail
          + '\n\nBrowser: ' + navigator.userAgent;
      }

      // Opened by double-clicking the file rather than through ./run.sh.
      // Browsers block ES modules over file:// (SPEC.md §1), so the page
      // renders its static furniture and the game never loads at all. Say so
      // at once — the symptoms otherwise look like a broken game.
      if (location.protocol === 'file:') {
        report('This page was opened as a file, so the game cannot run.',
          'Browsers refuse to load ES modules over file://, which is why the\n'
          + 'board is empty and the keys do nothing. Nothing is wrong with the game.\n\n'
          + 'Start the server and use the address it prints:\n\n'
          + '    ./run.sh\n'
          + '    http://localhost:8000');
        return;
      }

      // The page is not ours alone: browser extensions inject scripts into it
      // and throw their own failures at these same listeners. Blaming the game
      // for MetaMask's connection error is worse than saying nothing, because
      // it sends whoever is debugging into the wrong file entirely.
      function notOurs(where) {
        return /-extension:\/\//.test(where || '');
      }

      // Once the game is running, only failures traceable to our own files are
      // worth a banner over the board. Before it is running, report anything
      // that is not plainly a guest: at that point nothing else should be
      // failing, and a false negative costs more than a false positive.
      function ignore(where) {
        if (notOurs(where)) return true;
        return ready && where.indexOf(location.origin) === -1;
      }

      window.addEventListener('error', function (event) {
        // Subresource failures (a module that 404s) arrive as an error event
        // on the element and carry no message, so say which one it was.
        if (event.target && event.target !== window && event.target.src) {
          if (notOurs(event.target.src)) return;
          report('A script failed to load.', event.target.src);
          return;
        }
        var where = (event.filename || '') + ':' + (event.lineno || '?');
        if (ignore(where)) return;
        report(ready ? 'The game hit an error.' : 'The game threw before it could start.',
          (event.message || 'Unknown error') + '\n' + where);
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var detail = (reason && (reason.stack || reason.message)) || String(reason);
        if (ignore(detail)) return;
        report(ready ? 'The game hit an error.' : 'The game failed while starting.', detail);
      });

      // Nothing above fires for a module the browser refuses to run at all,
      // so also notice that the game simply never started.
      window.addEventListener('night-drop-started', function () { started = true; });
      window.addEventListener('night-drop-ready', function () { ready = true; });
      setTimeout(function () {
        if (started || !box.hidden) return;
        report('The game never started.',
          'index.html loaded but src/main.js did not run. Usually this means the\n'
          + 'browser could not parse a module, or the page was opened over file://\n'
          + 'instead of through ./run.sh. Check the browser console for the reason.');
      }, 3000);
    }());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
