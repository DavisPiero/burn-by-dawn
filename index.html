<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Drop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a18;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      min-width: 1280px;
      min-height: 800px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    #spread {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    #coord-readout {
      font-family: monospace;
      font-size: 14px;
      min-height: 18px;
    }
    #error {
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #1a1a18;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
    }
    #board {
      flex: 1 1 auto;
      min-width: 0;
      height: auto;
      background: #2a2a26;
    }

    /* The right-hand page of the spread. Plain for now; SPEC.md §11 dresses
       it as printed paper at M7. */
    #panel {
      flex: 0 0 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #turn-counter {
      font-family: ui-monospace, monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #f2e8d5;
    }
    #turn-counter.dawn {
      color: #c1272d;
    }
    #end-turn {
      padding: 10px;
      font: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      color: #1a1a18;
      background: #f2e8d5;
      border: 2px solid #1a1a18;
      cursor: pointer;
    }
    #end-turn:disabled {
      background: #6b6b63;
      color: #2a2a26;
      cursor: default;
    }
    #roster {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .roster-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #2a2a26;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .roster-item.selected {
      border-color: #c1272d;
    }
    .roster-item.spent {
      opacity: 0.55;
    }
    .roster-key {
      font-family: ui-monospace, monospace;
      font-weight: bold;
      color: #5c6b4a;
    }
    .roster-text {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
    }
    .roster-who {
      font-size: 13px;
    }
    .roster-detail {
      font-size: 11px;
      opacity: 0.65;
    }
    .roster-ap {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    #keys {
      font-size: 11px;
      opacity: 0.6;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>NIGHT DROP — M2: units, movement, AP, turn clock</h1>
    <div id="error" hidden></div>
    <div id="spread">
      <svg id="board"></svg>
      <aside id="panel">
        <div id="turn-counter"></div>
        <button id="end-turn" type="button"></button>
        <ul id="roster"></ul>
        <div id="keys">
          1–6 select trooper · Tab cycle · H hold position<br />
          Space end turn · Esc or right-click cancel
        </div>
      </aside>
    </div>
    <div id="coord-readout">Loading map…</div>
    <ul id="legend"></ul>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
