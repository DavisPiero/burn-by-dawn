<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Drop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a18;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      min-width: 1280px;
      min-height: 800px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    #spread {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    #coord-readout {
      font-family: monospace;
      font-size: 14px;
      min-height: 18px;
    }
    #error {
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #1a1a18;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
    }
    #board {
      flex: 1 1 auto;
      min-width: 0;
      height: auto;
      background: #2a2a26;
    }

    /* The right-hand page of the spread. Plain for now; SPEC.md §11 dresses
       it as printed paper at M7. */
    #panel {
      flex: 0 0 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #turn-counter {
      font-family: ui-monospace, monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #f2e8d5;
    }
    #turn-counter.dawn {
      color: #c1272d;
    }
    #end-turn {
      padding: 10px;
      font: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      color: #1a1a18;
      background: #f2e8d5;
      border: 2px solid #1a1a18;
      cursor: pointer;
    }
    #end-turn:disabled {
      background: #6b6b63;
      color: #2a2a26;
      cursor: default;
    }
    #roster {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .roster-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #2a2a26;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .roster-item.selected {
      border-color: #c1272d;
    }
    .roster-item.spent {
      opacity: 0.55;
    }
    .roster-key {
      font-family: ui-monospace, monospace;
      font-weight: bold;
      color: #5c6b4a;
    }
    .roster-text {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
    }
    .roster-who {
      font-size: 13px;
    }
    .roster-detail {
      font-size: 11px;
      opacity: 0.65;
    }
    .roster-ap {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    #keys {
      font-size: 11px;
      opacity: 0.6;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>NIGHT DROP — M2: units, movement, AP, turn clock</h1>
    <div id="error" hidden></div>
    <div id="spread">
      <svg id="board"></svg>
      <aside id="panel">
        <div id="turn-counter"></div>
        <button id="end-turn" type="button"></button>
        <ul id="roster"></ul>
        <div id="keys">
          1–6 select trooper · Tab cycle · H hold position<br />
          Space end turn · Esc or right-click cancel
        </div>
      </aside>
    </div>
    <div id="coord-readout">Loading map…</div>
    <ul id="legend"></ul>
  </div>
  <!--
    Failure reporting. This is a classic script, not a module, and it runs
    before the game does, so it still works when the module itself is what
    failed. Without it, a module that will not load or link leaves the page
    sitting on "Loading map…" with nothing said out loud — which is exactly
    the guessing game the loud data errors in map.js exist to prevent.
  -->
  <script>
    (function () {
      var box = document.getElementById('error');
      var started = false;

      function report(what, detail) {
        box.hidden = false;
        box.textContent = what + '\n\n' + detail
          + '\n\nBrowser: ' + navigator.userAgent;
      }

      // Opened by double-clicking the file rather than through ./run.sh.
      // Browsers block ES modules over file:// (SPEC.md §1), so the page
      // renders its static furniture and the game never loads at all. Say so
      // at once — the symptoms otherwise look like a broken game.
      if (location.protocol === 'file:') {
        report('This page was opened as a file, so the game cannot run.',
          'Browsers refuse to load ES modules over file://, which is why the\n'
          + 'board is empty and the keys do nothing. Nothing is wrong with the game.\n\n'
          + 'Start the server and use the address it prints:\n\n'
          + '    ./run.sh\n'
          + '    http://localhost:8000');
        return;
      }

      window.addEventListener('error', function (event) {
        // Subresource failures (a module that 404s) arrive as an error event
        // on the element and carry no message, so say which one it was.
        if (event.target && event.target !== window && event.target.src) {
          report('A script failed to load.', event.target.src);
          return;
        }
        report('The game threw before it could start.',
          (event.message || 'Unknown error') + '\n' + (event.filename || '') + ':' + (event.lineno || '?'));
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        report('The game failed while starting.',
          (reason && (reason.stack || reason.message)) || String(reason));
      });

      // Nothing above fires for a module the browser refuses to run at all,
      // so also notice that the game simply never started.
      window.addEventListener('night-drop-started', function () { started = true; });
      setTimeout(function () {
        if (started || !box.hidden) return;
        report('The game never started.',
          'index.html loaded but src/main.js did not run. Usually this means the\n'
          + 'browser could not parse a module, or the page was opened over file://\n'
          + 'instead of through ./run.sh. Check the browser console for the reason.');
      }, 3000);
    }());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
