<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Drop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a18;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
    }
    /* The whole game fits the window; the board scales to whatever room is
       left over. Nothing here is a breakpoint or a mobile layout (CLAUDE.md
       rule 3) — it is one desktop layout that measures the viewport instead of
       assuming it. The hover readout is the game's risk display (SPEC.md §4)
       and must never be below the fold. */
    #app {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      min-width: 1280px;
      height: 100%;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    #spread {
      display: flex;
      gap: 16px;
      align-items: stretch;
      /* Takes the height the fixed rows above and below do not want, and
         min-height:0 lets it actually shrink rather than forcing the page
         taller than the window. */
      flex: 1 1 auto;
      min-height: 0;
    }
    #coord-readout {
      flex: 0 0 auto;
      font-family: monospace;
      font-size: 14px;
      min-height: 18px;
    }
    #error {
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #legend {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #1a1a18;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
    }
    /* Sized by both axes, so the SVG's own preserveAspectRatio letterboxes the
       board to fit rather than dictating the page height. No background: the
       terrain paints the whole board, so a backdrop would only show as bars
       down the sides when the fit is width-limited. */
    #board {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }

    /* The right-hand page of the spread. Plain for now; SPEC.md §11 dresses
       it as printed paper at M7. */
    #panel {
      flex: 0 0 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
    }
    #turn-counter {
      font-family: ui-monospace, monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #f2e8d5;
    }
    #turn-counter.dawn {
      color: #c1272d;
    }
    #end-turn {
      padding: 10px;
      font: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      color: #1a1a18;
      background: #f2e8d5;
      border: 2px solid #1a1a18;
      cursor: pointer;
    }
    #end-turn:disabled {
      background: #6b6b63;
      color: #2a2a26;
      cursor: default;
    }
    #alert {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #alert-dial {
      flex: 0 0 104px;
      width: 104px;
      height: 104px;
    }
    #alert-caption {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.35;
    }
    .alert-heading {
      font-weight: bold;
      letter-spacing: 1px;
      color: #f2e8d5;
    }
    .alert-states {
      margin: 2px 0;
      padding-left: 18px;
      opacity: 0.8;
    }
    .alert-states .active {
      font-weight: bold;
      opacity: 1;
      padding: 0 6px;
      margin-left: -6px;
      border-radius: 3px;
      width: fit-content;
    }
    .alert-note {
      font-size: 11px;
      opacity: 0.65;
    }
    #report {
      margin: 0;
      padding: 6px 8px 6px 22px;
      background: #2a2a26;
      font-size: 12px;
      line-height: 1.4;
    }
    #roster {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .roster-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #2a2a26;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .roster-item.selected {
      border-color: #c1272d;
    }
    .roster-item.spent {
      opacity: 0.55;
    }
    .roster-key {
      font-family: ui-monospace, monospace;
      font-weight: bold;
      color: #5c6b4a;
    }
    .roster-text {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
    }
    .roster-who {
      font-size: 13px;
    }
    .roster-detail {
      font-size: 11px;
      opacity: 0.65;
    }
    .roster-trait {
      font-size: 11px;
      color: #c9c2b0;
    }
    .roster-trait b {
      color: #f2e8d5;
    }
    .roster-bonus {
      color: #c1272d;
      font-weight: bold;
    }
    .roster-ap {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    #keys {
      font-size: 11px;
      opacity: 0.6;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>NIGHT DROP — M4: enemies and alert</h1>
    <div id="error" hidden></div>
    <div id="spread">
      <svg id="board"></svg>
      <aside id="panel">
        <div id="turn-counter"></div>
        <button id="end-turn" type="button"></button>
        <div id="alert">
          <svg id="alert-dial" viewBox="0 0 240 240"></svg>
          <div id="alert-caption"></div>
        </div>
        <ul id="report"></ul>
        <ul id="roster"></ul>
        <div id="keys">
          1–6 select trooper · Tab cycle · H hold position<br />
          Space end turn · Esc or right-click cancel<br />
          R patrol routes · hover an enemy for its arc and route
        </div>
      </aside>
    </div>
    <div id="coord-readout">Loading map…</div>
    <ul id="legend"></ul>
  </div>
  <!--
    Failure reporting. This is a classic script, not a module, and it runs
    before the game does, so it still works when the module itself is what
    failed. Without it, a module that will not load or link leaves the page
    sitting on "Loading map…" with nothing said out loud — which is exactly
    the guessing game the loud data errors in map.js exist to prevent.
  -->
  <script>
    (function () {
      var box = document.getElementById('error');
      var started = false; // src/main.js began executing
      var ready = false;   // …and got all the way through its first render

      function report(what, detail) {
        box.hidden = false;
        box.textContent = what + '\n\n' + detail
          + '\n\nBrowser: ' + navigator.userAgent;
      }

      // Opened by double-clicking the file rather than through ./run.sh.
      // Browsers block ES modules over file:// (SPEC.md §1), so the page
      // renders its static furniture and the game never loads at all. Say so
      // at once — the symptoms otherwise look like a broken game.
      if (location.protocol === 'file:') {
        report('This page was opened as a file, so the game cannot run.',
          'Browsers refuse to load ES modules over file://, which is why the\n'
          + 'board is empty and the keys do nothing. Nothing is wrong with the game.\n\n'
          + 'Start the server and use the address it prints:\n\n'
          + '    ./run.sh\n'
          + '    http://localhost:8000');
        return;
      }

      // The page is not ours alone: browser extensions inject scripts into it
      // and throw their own failures at these same listeners. Blaming the game
      // for MetaMask's connection error is worse than saying nothing, because
      // it sends whoever is debugging into the wrong file entirely.
      function notOurs(where) {
        return /-extension:\/\//.test(where || '');
      }

      // Once the game is running, only failures traceable to our own files are
      // worth a banner over the board. Before it is running, report anything
      // that is not plainly a guest: at that point nothing else should be
      // failing, and a false negative costs more than a false positive.
      function ignore(where) {
        if (notOurs(where)) return true;
        return ready && where.indexOf(location.origin) === -1;
      }

      window.addEventListener('error', function (event) {
        // Subresource failures (a module that 404s) arrive as an error event
        // on the element and carry no message, so say which one it was.
        if (event.target && event.target !== window && event.target.src) {
          if (notOurs(event.target.src)) return;
          report('A script failed to load.', event.target.src);
          return;
        }
        var where = (event.filename || '') + ':' + (event.lineno || '?');
        if (ignore(where)) return;
        report(ready ? 'The game hit an error.' : 'The game threw before it could start.',
          (event.message || 'Unknown error') + '\n' + where);
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var detail = (reason && (reason.stack || reason.message)) || String(reason);
        if (ignore(detail)) return;
        report(ready ? 'The game hit an error.' : 'The game failed while starting.', detail);
      });

      // Nothing above fires for a module the browser refuses to run at all,
      // so also notice that the game simply never started.
      window.addEventListener('night-drop-started', function () { started = true; });
      window.addEventListener('night-drop-ready', function () { ready = true; });
      setTimeout(function () {
        if (started || !box.hidden) return;
        report('The game never started.',
          'index.html loaded but src/main.js did not run. Usually this means the\n'
          + 'browser could not parse a module, or the page was opened over file://\n'
          + 'instead of through ./run.sh. Check the browser console for the reason.');
      }, 3000);
    }());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
