<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Drop</title>
  <style>
    /* The game is a double-page spread from an 80s comic annual (SPEC.md §11):
       the board on the left page, the briefing, dial, clock and roster rail
       on the right. Colours, paper and type come from src/render/theme.js,
       which sets the custom properties below at startup; the values here are
       only what shows before it runs. One desktop layout sized to the window,
       no breakpoints (CLAUDE.md rule 3). */
    :root {
      --paper: #F2E8D5;
      --ink: #1A1A18;
      --green: #5C6B4A;
      --red: #C1272D;
      --blue: #3D5A73;
      --leader: #2F7BBF;
      --typewriter: "Courier 10 Pitch", "Courier New", Courier, monospace;
      --slab: "Rockwell Condensed", Rockwell, "Courier New", serif;
      --paper-fibre: none;
      --dots-ink: none;
      --dots-blue: none;
      --dots-red: none;
      --dots-green: none;
      /* The page's age: browned edges and foxed corners, multiplied over it. */
      --edge-wear:
        radial-gradient(ellipse 30% 22% at 0 0, rgba(130, 90, 40, 0.20), transparent),
        radial-gradient(ellipse 26% 20% at 100% 100%, rgba(130, 90, 40, 0.18), transparent),
        radial-gradient(ellipse 18% 14% at 100% 0, rgba(130, 90, 40, 0.10), transparent),
        radial-gradient(circle 60px at 12% 88%, rgba(150, 110, 60, 0.08), transparent);
    }
    html, body {
      margin: 0;
      height: 100%;
      /* The table the annual lies open on. */
      background: #2d2b26;
      color: var(--ink);
      font-family: var(--typewriter);
    }
    button { font-family: var(--typewriter); }

    #spread {
      box-sizing: border-box;
      height: 100%;
      min-width: 1280px;
      min-height: 760px;
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 352px;
    }
    .page {
      position: relative;
      box-sizing: border-box;
      min-height: 0;
      background-color: var(--paper);
    }
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--edge-wear);
      box-shadow: inset 0 0 36px rgba(110, 80, 40, 0.22);
      mix-blend-mode: multiply;
    }
    /* The centre fold: each page darkens toward the crease, with a thin
       highlight where the paper rises out of it. */
    #left-page {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 6px;
      padding: 12px 26px 12px 4px;
      background-image:
        linear-gradient(to right, transparent calc(100% - 34px), rgba(70, 50, 25, 0.10) calc(100% - 14px), rgba(40, 28, 12, 0.42) calc(100% - 1px), rgba(255, 250, 235, 0.5)),
        var(--paper-fibre);
      box-shadow: -3px 3px 0 rgba(0, 0, 0, 0.5);
    }
    #panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 12px 12px 26px;
      overflow: hidden;
      font-size: 12px;
      background-image:
        linear-gradient(to left, transparent calc(100% - 30px), rgba(70, 50, 25, 0.10) calc(100% - 12px), rgba(40, 28, 12, 0.36)),
        var(--paper-fibre);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
    }

    /* The outer margin: the cut-out note and the seed (SPEC.md §1). */
    #outer-gutter {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }
    #gutter-note {
      flex: 1 1 auto;
      min-height: 0;
      width: 34px;
    }
    #seed {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      padding: 4px 0;
    }
    #seed a { color: inherit; opacity: 0.6; }

    #left-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }
    /* Sized by both axes, so the SVG's own preserveAspectRatio letterboxes the
       board to fit rather than dictating the page height. */
    #board {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }

    /* Comic caption boxes: paper, an ink rule and a hard offset shadow. */
    .caption {
      margin: 0;
      padding: 5px 9px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .caption-head {
      margin: -5px -9px 5px;
      padding: 2px 9px;
      font-family: var(--slab);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--paper);
      background: var(--ink);
    }
    /* The hover readout is the risk display (SPEC.md §4) and is always shown.
       A fixed four lines: a readout that grew with its text took height from
       the board, which rescaled under the mouse. ui.js renderReadout puts the
       warnings first, so anything cut off is terrain detail, never a risk. */
    #coord-readout {
      flex: 0 0 auto;
      font-size: 13px;
      line-height: 17px;
      height: 68px;
      overflow: hidden;
    }
    #report {
      flex: 0 0 auto;
      height: 100px;
      overflow-y: auto;
      list-style: none;
      font-size: 12px;
      line-height: 1.4;
      background-image: var(--dots-ink);
      background-color: var(--paper);
    }
    #report li { padding: 0 4px; background: var(--paper); }
    #report li + li { margin-top: 1px; }
    #report li.located { cursor: default; }
    #report li.located:hover { background: var(--ink); color: var(--paper); }

    #error {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 900px;
      padding: 12px 16px;
      border: 2px solid #c1272d;
      background: #2a1516;
      color: #f2e8d5;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* The fixed strip at the top of the right page: the clock, End turn and
       the selected man's actions (SPEC.md §11 layout notes). */
    #strip {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #clock {
      position: relative;
      height: 40px;
    }
    #dawn-strip {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #turn-counter {
      position: absolute;
      left: 8px;
      top: 4px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--paper);
      text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
    }
    #keys-tab {
      position: absolute;
      right: 6px;
      top: 6px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: bold;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      cursor: help;
    }
    .btn, #end-turn, #diversion, .action {
      font-family: var(--typewriter);
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
    }
    /* Pressed in one step, no easing. */
    .btn:active:not(:disabled), #end-turn:active:not(:disabled), #diversion:active:not(:disabled), .action:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    #end-turn {
      padding: 6px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      background-image: var(--dots-red);
      background-color: var(--paper);
    }
    #end-turn:disabled, #diversion:disabled, .action:disabled {
      color: rgba(26, 26, 24, 0.5);
      background-image: var(--dots-ink);
      box-shadow: none;
      border-color: rgba(26, 26, 24, 0.45);
      cursor: default;
    }
    #actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      min-height: 94px;
      align-content: start;
    }
    #actions.idle {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0.6;
      border: 2px dashed rgba(26, 26, 24, 0.35);
    }
    .action-wrap { display: flex; min-width: 0; }
    .action-wrap .action { flex: 1 1 auto; }
    .action:disabled { pointer-events: none; }
    .action {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      padding: 2px 4px;
      text-align: left;
    }
    .action.active {
      color: var(--paper);
      background: var(--blue);
    }
    .action-name {
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .action-cost {
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    #alert {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: help;
    }
    #alert-dial {
      flex: 0 0 76px;
      width: 76px;
      height: 76px;
    }
    .alert-heading {
      font-family: var(--slab);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .alert-state {
      display: inline-block;
      margin: 2px 0;
      padding: 0 6px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--paper);
    }
    .alert-note {
      font-size: 11px;
    }

    #mission-box { flex: 0 0 auto; }
    #mission {
      margin: 0 0 5px;
      padding: 0;
      list-style: none;
      font-size: 12px;
      line-height: 1.4;
    }
    #mission li::before { content: "▸ "; }
    #mission .done { text-decoration: line-through; text-decoration-color: var(--red); }
    #mission i { font-style: normal; opacity: 0.7; }
    #diversion {
      width: 100%;
      padding: 3px;
      font-size: 12px;
      font-weight: bold;
      color: var(--paper);
      background: var(--blue);
    }

    /* The roster rail (SPEC.md §11): all six, always visible, greying out as
       men are lost. Six compact slots that fit 1280x800 without scrolling;
       the detail is in each slot's rollover. */
    #roster {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 0 3px 3px 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: 7px;
    }
    .slot {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      overflow: hidden;
    }
    .slot.selected { border-color: var(--red); box-shadow: 2px 2px 0 var(--red); outline: 2px solid var(--red); }
    .slot .portrait {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }
    .slot.lost { cursor: default; }
    .slot.lost .portrait { filter: grayscale(1) contrast(0.7); opacity: 0.45; }
    .slot-num {
      position: absolute;
      top: 0;
      left: 0;
      padding: 0 5px;
      font-weight: bold;
      font-size: 12px;
      color: var(--paper);
      background: var(--ink);
    }
    .slot-strip {
      flex: 0 0 auto;
      padding: 1px 4px 2px;
      color: var(--paper);
      background: var(--green);
      border-top: 2px solid var(--ink);
    }
    .slot.leader .slot-strip { background: var(--leader); }
    .slot.lost .slot-strip { background: #6f6c63; }
    .slot-name {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
    }
    .slot-line {
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-stamp {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%) rotate(-14deg);
      padding: 0 5px;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--red);
      background: rgba(242, 232, 213, 0.85);
      border: 3px solid var(--red);
      white-space: nowrap;
    }
    .slot-stamp.safe { color: var(--green); border-color: var(--green); }
    .slot-stamp.warn { font-size: 11px; top: 16%; }

    /* The results: the back page of the annual (SPEC.md §10), printed over
       the right page, the board still open beside it. */
    #results {
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 12px 14px 12px 28px;
      overflow-y: auto;
      background-color: var(--paper);
      background-image: var(--paper-fibre);
      font-size: 12px;
    }
    #results .logo { display: block; width: 100%; height: 100px; }
    #results .kicker {
      font-family: var(--slab);
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 11px;
      text-align: center;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      margin: 4px 0 8px;
    }
    #results h2 {
      margin: 0 0 4px;
      font-family: var(--slab);
      font-size: 24px;
      letter-spacing: 1px;
    }
    #results.success h2 { color: var(--green); }
    #results.withdrawn h2 { color: var(--blue); }
    #results.failed h2 { color: var(--red); }
    #results p { margin: 0 0 8px; }
    #results .fates { list-style: none; margin: 0 0 8px; padding: 0; }
    #results .fates li { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    #results .fates svg { width: 22px; height: 22px; flex: 0 0 22px; }
    #results .fate-lost svg { filter: grayscale(1); opacity: 0.5; }
    #results .fate-lost b { color: var(--red); }
    #results table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    #results td:last-child { text-align: right; }
    #results .total td { border-top: 2px solid var(--ink); font-weight: bold; font-size: 14px; }
    #results button { padding: 4px 12px; font-size: 13px; font-weight: bold; }

    /* Rollovers (SPEC.md §11): detail kept off the page until asked for. */
    #popup {
      position: fixed;
      z-index: 20;
      max-width: 320px;
      padding: 6px 9px;
      font-family: var(--typewriter);
      font-size: 12px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      pointer-events: none;
      white-space: pre-line;
    }
    #popup b { font-size: 13px; }
    #popup .popup-dim { opacity: 0.7; }
  </style>
</head>
<body>
  <main id="spread">
    <section id="left-page" class="page">
      <div id="outer-gutter">
        <svg id="gutter-note" viewBox="0 0 60 900" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="seed"></div>
      </div>
      <div id="left-content">
        <svg id="board"></svg>
        <div id="coord-readout" class="caption">Loading map…</div>
        <ul id="report" class="caption"></ul>
      </div>
    </section>
    <aside id="panel" class="page">
      <div id="strip">
        <div id="clock">
          <svg id="dawn-strip" viewBox="0 0 600 60" preserveAspectRatio="none"></svg>
          <div id="turn-counter"></div>
          <button id="keys-tab" type="button">KEYS</button>
        </div>
        <button id="end-turn" type="button"></button>
        <div id="actions"></div>
      </div>
      <div id="alert">
        <svg id="alert-dial" viewBox="0 0 240 240"></svg>
        <div id="alert-caption"></div>
      </div>
      <div id="mission-box" class="caption">
        <div class="caption-head">MISSION BRIEFING</div>
        <ul id="mission"></ul>
        <button id="diversion" type="button"></button>
      </div>
      <ul id="roster"></ul>
      <section id="results" hidden></section>
    </aside>
  </main>
  <div id="error" hidden></div>
  <div id="popup" hidden></div>
  <!--
    Failure reporting. This is a classic script, not a module, and it runs
    before the game does, so it still works when the module itself is what
    failed. Without it, a module that will not load or link leaves the page
    sitting on "Loading map…" with nothing said out loud — which is exactly
    the guessing game the loud data errors in map.js exist to prevent.
  -->
  <script>
    (function () {
      var box = document.getElementById('error');
      var started = false; // src/main.js began executing
      var ready = false;   // …and got all the way through its first render

      function report(what, detail) {
        box.hidden = false;
        box.textContent = what + '\n\n' + detail
          + '\n\nBrowser: ' + navigator.userAgent;
      }

      // Opened by double-clicking the file rather than through ./run.sh.
      // Browsers block ES modules over file:// (SPEC.md §1), so the page
      // renders its static furniture and the game never loads at all. Say so
      // at once — the symptoms otherwise look like a broken game.
      if (location.protocol === 'file:') {
        report('This page was opened as a file, so the game cannot run.',
          'Browsers refuse to load ES modules over file://, which is why the\n'
          + 'board is empty and the keys do nothing. Nothing is wrong with the game.\n\n'
          + 'Start the server and use the address it prints:\n\n'
          + '    ./run.sh\n'
          + '    http://localhost:8000');
        return;
      }

      // The page is not ours alone: browser extensions inject scripts into it
      // and throw their own failures at these same listeners. Blaming the game
      // for MetaMask's connection error is worse than saying nothing, because
      // it sends whoever is debugging into the wrong file entirely.
      function notOurs(where) {
        return /-extension:\/\//.test(where || '');
      }

      // Once the game is running, only failures traceable to our own files are
      // worth a banner over the board. Before it is running, report anything
      // that is not plainly a guest: at that point nothing else should be
      // failing, and a false negative costs more than a false positive.
      function ignore(where) {
        if (notOurs(where)) return true;
        return ready && where.indexOf(location.origin) === -1;
      }

      window.addEventListener('error', function (event) {
        // Subresource failures (a module that 404s) arrive as an error event
        // on the element and carry no message, so say which one it was.
        if (event.target && event.target !== window && event.target.src) {
          if (notOurs(event.target.src)) return;
          report('A script failed to load.', event.target.src);
          return;
        }
        var where = (event.filename || '') + ':' + (event.lineno || '?');
        if (ignore(where)) return;
        report(ready ? 'The game hit an error.' : 'The game threw before it could start.',
          (event.message || 'Unknown error') + '\n' + where);
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var detail = (reason && (reason.stack || reason.message)) || String(reason);
        if (ignore(detail)) return;
        report(ready ? 'The game hit an error.' : 'The game failed while starting.', detail);
      });

      // Nothing above fires for a module the browser refuses to run at all,
      // so also notice that the game simply never started.
      window.addEventListener('night-drop-started', function () { started = true; });
      window.addEventListener('night-drop-ready', function () { ready = true; });
      setTimeout(function () {
        if (started || !box.hidden) return;
        report('The game never started.',
          'index.html loaded but src/main.js did not run. Usually this means the\n'
          + 'browser could not parse a module, or the page was opened over file://\n'
          + 'instead of through ./run.sh. Check the browser console for the reason.');
      }, 3000);
    }());
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
